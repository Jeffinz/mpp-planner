<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work Planner</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="top">
        <div>
            <h1>Work Planner</h1>
            <p>ระบบจัดการตารางงานแบบเรียบง่าย</p>
        </div>
        <div class="actions" id="actions" hidden>
            <button id="btn-holidays" class="ghost" type="button">วันหยุด</button>
            <button id="btn-settings" class="ghost" type="button">จัดการข้อมูล</button>
            <button id="btn-signout" class="ghost" type="button">ออกจากระบบ</button>
        </div>
    </header>

    <section class="signin" id="signin" hidden>
        <p>เข้าสู่ระบบด้วยบัญชี Google เพื่อดูและแก้ไขตารางงาน</p>
        <button id="btn-signin" class="primary" type="button">เข้าสู่ระบบด้วย Google</button>
    </section>

    <main id="app" hidden>
        <section class="toolbar">
            <div class="month-nav">
                <button id="btn-prev" class="icon" type="button" aria-label="เดือนก่อนหน้า">‹</button>
                <select id="select-month" aria-label="เดือน">
                    <option value="0">มกราคม</option>
                    <option value="1">กุมภาพันธ์</option>
                    <option value="2">มีนาคม</option>
                    <option value="3">เมษายน</option>
                    <option value="4">พฤษภาคม</option>
                    <option value="5">มิถุนายน</option>
                    <option value="6">กรกฎาคม</option>
                    <option value="7">สิงหาคม</option>
                    <option value="8">กันยายน</option>
                    <option value="9">ตุลาคม</option>
                    <option value="10">พฤศจิกายน</option>
                    <option value="11">ธันวาคม</option>
                </select>
                <select id="select-year" aria-label="ปี"></select>
                <button id="btn-next" class="icon" type="button" aria-label="เดือนถัดไป">›</button>
            </div>
            <button id="btn-new" class="primary" type="button">เพิ่มงานใหม่</button>
        </section>

        <p class="loading" id="loading" role="status" hidden>กำลังโหลดข้อมูล...</p>

        <div class="calendar">
            <div class="weekdays">
                <div class="end">อาทิตย์</div>
                <div>จันทร์</div>
                <div>อังคาร</div>
                <div>พุธ</div>
                <div>พฤหัสบดี</div>
                <div>ศุกร์</div>
                <div class="end">เสาร์</div>
            </div>
            <div class="grid" id="grid"></div>
        </div>

        <section class="list" id="list" aria-label="รายการงานประจำเดือน"></section>
    </main>

    <div class="toast" id="toast" role="status"><span id="toast-msg"></span></div>

    <!-- Task modal -->
    <dialog id="task-modal" aria-labelledby="modal-title">
        <div class="sheet">
            <header class="sheet-head">
                <h2 id="modal-title">เพิ่มงานใหม่</h2>
                <button id="btn-close-task" class="icon" type="button" aria-label="ปิด">×</button>
            </header>
            <form id="task-form" class="sheet-body">
                <input type="hidden" id="task-id" />
                <label>วันที่ปฏิบัติงาน
                    <span class="thai-date">
                        <input type="text" id="task-date" inputmode="numeric" placeholder="วว/ดด/ปปปป (พ.ศ.)" autocomplete="off" required />
                        <button type="button" class="icon" data-pick="task-date" aria-label="เลือกจากปฏิทิน">📅</button>
                    </span>
                </label>
                <label>ช่วงเวลา
                    <select id="task-slot">
                        <option value="MORNING">เช้า</option>
                        <option value="AFTERNOON">บ่าย</option>
                        <option value="FULL_DAY">ทั้งวัน</option>
                    </select>
                </label>
                <div class="two">
                    <label>เวลาเริ่ม
                        <input type="time" id="task-time-start" required />
                    </label>
                    <label>เวลาจบ
                        <input type="time" id="task-time-end" required />
                    </label>
                </div>
                <label>ชื่องาน / กิจกรรม
                    <textarea id="task-project" rows="2" placeholder="กรอกรายละเอียดงาน..." required></textarea>
                </label>
            </form>
            <footer class="sheet-foot">
                <button id="btn-delete" class="danger" type="button" hidden>ลบงานนี้</button>
                <span class="grow"></span>
                <button id="btn-cancel" class="ghost" type="button">ยกเลิก</button>
                <button class="primary" type="submit" form="task-form">บันทึก</button>
            </footer>
        </div>
    </dialog>

    <!-- Settings modal -->
    <dialog id="settings-modal" aria-labelledby="settings-title">
        <div class="sheet">
            <header class="sheet-head">
                <h2 id="settings-title">จัดการข้อมูล</h2>
                <button id="settings-close" class="icon" type="button" aria-label="ปิด">×</button>
            </header>
            <div class="stack">
                <button id="btn-clear-all" class="danger wide" type="button">ล้างข้อมูลงานทั้งหมด</button>
                <p>วันหยุดพิเศษจะไม่ถูกลบ</p>
            </div>
        </div>
    </dialog>

    <!-- Holiday modal -->
    <dialog id="holiday-modal" aria-labelledby="holiday-title">
        <div class="sheet">
            <header class="sheet-head">
                <h2 id="holiday-title">จัดการวันหยุดพิเศษ</h2>
                <button id="holiday-close" class="icon" type="button" aria-label="ปิด">×</button>
            </header>
            <div class="stack">
                <span class="thai-date">
                    <input type="text" id="holiday-picker" inputmode="numeric" placeholder="วว/ดด/ปปปป (พ.ศ.)" autocomplete="off" aria-label="เลือกวันที่ (พ.ศ.)" />
                    <button type="button" class="icon" data-pick="holiday-picker" aria-label="เลือกจากปฏิทิน">📅</button>
                </span>
                <button id="holiday-add" class="primary wide" type="button">ตั้งเป็นวันหยุด</button>
                <div id="holiday-list" class="list-box"></div>
            </div>
        </div>
    </dialog>

    <!-- Confirm dialog — replaces browser confirm() for delete and clear-all actions -->
    <dialog id="confirm-modal" aria-labelledby="confirm-msg">
        <div class="sheet">
            <div class="stack">
                <p id="confirm-msg"></p>
            </div>
            <footer class="sheet-foot">
                <span class="grow"></span>
                <button id="confirm-cancel" class="ghost" type="button">ยกเลิก</button>
                <button id="confirm-ok" class="danger" type="button">ยืนยัน</button>
            </footer>
        </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>

</html>
