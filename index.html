<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Work Planner</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-layout">
      <!-- Header Zone -->
      <header class="app-header">
        <div class="header-brand">
          <div class="brand-icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
              />
            </svg>
          </div>
          <div>
            <h1 class="app-title">Work Planner</h1>
            <p class="app-subtitle">จัดการงานอย่างมีประสิทธิภาพและสบายตา</p>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Left Column: Input Form & Controls -->
        <section class="panel-section input-panel">
          <div class="card">
            <h2 class="card-title">เพิ่มรายการใหม่</h2>
            <form id="planner-form" class="planner-form">
              <div class="form-group">
                <label for="task-title">ชื่องาน / รายการ</label>
                <input
                  type="text"
                  id="task-title"
                  class="form-control"
                  placeholder="เช่น สรุปรายงานประจำเดือน..."
                  required
                />
              </div>

              <div class="form-row">
                <div class="form-group col">
                  <label for="task-category">หมวดหมู่</label>
                  <select id="task-category" class="form-control">
                    <option value="work">งาน (Work)</option>
                    <option value="personal">ส่วนตัว (Personal)</option>
                    <option value="urgent">เร่งด่วน (Urgent)</option>
                  </select>
                </div>
                <div class="form-group col">
                  <label for="task-date">กำหนดส่ง</label>
                  <input type="date" id="task-date" class="form-control" />
                </div>
              </div>

              <div class="form-group">
                <label for="task-desc">รายละเอียดเพิ่มเติม</label>
                <textarea
                  id="task-desc"
                  class="form-control"
                  rows="3"
                  placeholder="ระบุรายละเอียดย่อ..."
                ></textarea>
              </div>

              <button type="submit" id="add-btn" class="btn btn-primary">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                บันทึกรายการ
              </button>
            </form>
          </div>
        </section>

        <!-- Right Column: Task Board / List Display -->
        <section class="panel-section list-panel">
          <div class="card">
            <div class="list-header">
              <h2 class="card-title">รายการงานทั้งหมด</h2>
              <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">
                  ทั้งหมด
                </button>
                <button class="filter-btn" data-filter="pending">
                  รอดำเนินการ
                </button>
                <button class="filter-btn" data-filter="completed">
                  เสร็จสิ้น
                </button>
              </div>
            </div>

            <div id="task-list" class="task-list-container">
              <!-- Tasks dynamically injected by app.js -->
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
